        }

        // ========== 提交订单 ==========
        function submitOrder(e){ e.preventDefault(); if(isClientSubmitted()&&!isAdmin){ showToast('⚠️ 您的订单已提交，无法再次提交'); return; } const cn=document.getElementById('f_cn').value.trim(); const contact=document.getElementById('f_contact').value.trim(); const ip=document.getElementById('f_ip').value.trim(); const project=document.getElementById('f_project').value.trim(); const character=document.getElementById('f_character').value.trim(); const purposeSelect=document.getElementById('purpose_select'); const scheduleSelect=document.getElementById('schedule_select'); const urgentSelect=document.getElementById('urgent_select'); const ddl=document.getElementById('f_ddl').value; const purposeId=purposeSelect?purposeSelect.value:''; const scheduleId=scheduleSelect?scheduleSelect.value:''; const urgentId=urgentSelect?urgentSelect.value:''; if(!cn||!contact||!project||!ddl||!purposeId){ showToast('请填写完整信息（带 * 的必填）'); return; } if(currentItems.length===0||currentItems.some(it=>!it.productName)){ showToast('请添加至少一个完整的制品'); return; } const purposeOpts=getPurposeOptions(), scheduleOpts=getScheduleOptions(), urgentOpts=getUrgentOptions(); const purposeLabel=purposeOpts.find(o=>o.id===purposeId)?.label||'', scheduleLabel=scheduleOpts.find(o=>o.id===scheduleId)?.label||'', urgentLabel=urgentOpts.find(o=>o.id===urgentId)?.label||''; const multiplier=calcFinalMultiplier(purposeId,scheduleId,urgentId); recalcAllItems(purposeId,scheduleId,urgentId); const total=calcOrderTotal(currentItems,purposeId,scheduleId,urgentId); const newOrder={id:uid(),cn,contact,ip,projectName:project,characterName:character,purposeId:purposeId,purposeLabel:purposeLabel,scheduleId:scheduleId,scheduleLabel:scheduleLabel,urgentId:urgentId,urgentLabel:urgentLabel,ddl,status:'进行中',totalPrice:total,multiplier:multiplier,items:JSON.parse(JSON.stringify(currentItems)),createdAt:Date.now()}; if(editingOrderId){ const idx=data.orders.findIndex(o=>o.id===editingOrderId); if(idx!==-1){ newOrder.id=editingOrderId; newOrder.createdAt=data.orders[idx].createdAt; data.orders[idx]=newOrder; } editingOrderId=null; } else { data.orders.push(newOrder); } saveData(); if(!isAdmin){ setClientSubmitted(true); currentItems=[]; showToast('✅ 企划提交成功！表单已锁定，无法再次修改'); setTimeout(()=>{ navigateTo('home'); },600); } else { showToast('🎉 企划提交成功！已加入排单表'); navigateTo('orders'); } document.getElementById('orderForm').reset(); }
        function resetForm(){ if(isClientSubmitted()&&!isAdmin){ showToast('⚠️ 订单已提交，无法清空'); return; } currentItems=[]; editingOrderId=null; const pOpts=getPurposeOptions(); currentPurposeId=pOpts.length>0?pOpts[0].id:''; currentScheduleId=''; const uOpts=getUrgentOptions(); const noneOpt=uOpts.find(o=>o.label==='无'); currentUrgentId=noneOpt?noneOpt.id:(uOpts.length>0?uOpts[0].id:''); document.getElementById('orderForm')?.reset(); renderContent(); showToast('已清空'); }

        // ========== 订单操作 ==========
        function deleteOrder(id){ if(!confirm('确定删除这个订单吗？')) return; data.orders=data.orders.filter(o=>o.id!==id); saveData(); renderContent(); showToast('已删除'); }
        function toggleStatus(id){ const order=data.orders.find(o=>o.id===id); if(!order) return; order.status=order.status==='已完成'?'进行中':'已完成'; saveData(); renderContent(); showToast('状态已更新'); }
        function editOrder(id){ const order=data.orders.find(o=>o.id===id); if(!order) return; currentItems=order.items||[]; editingOrderId=id; currentPurposeId=order.purposeId||''; currentScheduleId=order.scheduleId||''; currentUrgentId=order.urgentId||''; navigateTo('order_form'); setTimeout(()=>{ document.getElementById('f_cn').value=order.cn||''; document.getElementById('f_contact').value=order.contact||''; document.getElementById('f_ip').value=order.ip||''; document.getElementById('f_project').value=order.projectName||''; document.getElementById('f_character').value=order.characterName||''; document.getElementById('f_ddl').value=order.ddl||''; const purposeSelect=document.getElementById('purpose_select'); if(purposeSelect) purposeSelect.value=order.purposeId||''; const scheduleSelect=document.getElementById('schedule_select'); if(scheduleSelect) scheduleSelect.value=order.scheduleId||''; const urgentSelect=document.getElementById('urgent_select'); if(urgentSelect) urgentSelect.value=order.urgentId||''; recalcAllItems(currentPurposeId,currentScheduleId,currentUrgentId); onOptionChange(); updateMultiplierDisplay(); const form=document.getElementById('orderForm'); form.onsubmit=function(e){ e.preventDefault(); const purposeId=document.getElementById('purpose_select').value; const scheduleId=document.getElementById('schedule_select').value; const urgentId=document.getElementById('urgent_select').value; const multiplier=calcFinalMultiplier(purposeId,scheduleId,urgentId); recalcAllItems(purposeId,scheduleId,urgentId); const total=calcOrderTotal(currentItems,purposeId,scheduleId,urgentId); const purposeOpts=getPurposeOptions(), scheduleOpts=getScheduleOptions(), urgentOpts=getUrgentOptions(); order.cn=document.getElementById('f_cn').value.trim(); order.contact=document.getElementById('f_contact').value.trim(); order.ip=document.getElementById('f_ip').value.trim(); order.projectName=document.getElementById('f_project').value.trim(); order.characterName=document.getElementById('f_character').value.trim(); order.purposeId=purposeId; order.purposeLabel=purposeOpts.find(o=>o.id===purposeId)?.label||''; order.scheduleId=scheduleId; order.scheduleLabel=scheduleOpts.find(o=>o.id===scheduleId)?.label||''; order.urgentId=urgentId; order.urgentLabel=urgentOpts.find(o=>o.id===urgentId)?.label||''; order.ddl=document.getElementById('f_ddl').value; order.totalPrice=total; order.multiplier=multiplier; order.items=JSON.parse(JSON.stringify(currentItems)); saveData(); currentItems=[]; editingOrderId=null; showToast('✅ 订单已更新'); navigateTo('orders'); }; },50); showToast('📝 正在加载订单，修改后提交即更新'); }

        // ========== 价目表操作 ==========
        function addPrice(){ const name=prompt('输入制品名：'); if(!name) return; const category=prompt('输入类别：')||'其他'; const price=parseFloat(prompt('输入单价：'))||0; const note=prompt('输入备注（可选）：')||''; data.priceList.push({id:uid(),name,category,price,note}); const order=getSortOrder()||[]; order.push(data.priceList[data.priceList.length-1].id); saveSortOrder(order); saveData(); renderContent(); showToast('已添加'); }
        function deletePrice(id){ if(!confirm('删除这个制品？')) return; data.priceList=data.priceList.filter(p=>p.id!==id); const order=getSortOrder()?.filter(oid=>oid!==id)||[]; saveSortOrder(order); saveData(); renderContent(); showToast('已删除'); }

        // ========== Toast ==========
        function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._timer); el._timer=setTimeout(()=>el.classList.remove('show'),2800); }

        // ========== 初始化 ==========
        const savedTheme=getCurrentTheme(); applyTheme(savedTheme); updateAllNameDisplay(getWorkbenchName()); clientSubmitted=isClientSubmitted(); const initPurposeOpts=getPurposeOptions(); if(initPurposeOpts.length>0) currentPurposeId=initPurposeOpts[0].id; const initUrgentOpts=getUrgentOptions(); const initNoneOpt=initUrgentOpts.find(o=>o.label==='无'); currentUrgentId=initNoneOpt?initNoneOpt.id:(initUrgentOpts.length>0?initUrgentOpts[0].id:''); if(localStorage.getItem(MOLD_MODE_KEY)===null){ saveMoldMode(DEFAULT_MOLD_MODE); saveMoldFixedAmount(DEFAULT_MOLD_FIXED); saveMoldDiscountMultiplier(DEFAULT_MOLD_DISCOUNT); } recalcAllItems(currentPurposeId,currentScheduleId,currentUrgentId);

        // 暴露全局函数
        window.navigateTo=navigateTo; window.deleteOrder=deleteOrder; window.toggleStatus=toggleStatus; window.editOrder=editOrder; window.addPrice=addPrice; window.deletePrice=deletePrice; window.changeMonth=changeMonth; window.doSearch=doSearch; window.submitOrder=submitOrder; window.resetForm=resetForm; window.openItemModal=openItemModal; window.editTerms=editTerms; window.showToast=showToast; window.onOptionChange=onOptionChange; window.updateMultiplierDisplay=updateMultiplierDisplay; window.initInlineEdit=initInlineEdit; window.openLogin=openLogin; window.closeLogin=closeLogin; window.doLogin=doLogin; window.enterClientMode=enterClientMode; window.logout=logout; window.changePassword=changePassword; window.exportData=exportData; window.importData=importData; window.renameWorkbench=renameWorkbench; window.switchTheme=switchTheme; window.editOptionLabel=editOptionLabel; window.editOptionMultiplier=editOptionMultiplier; window.deleteOption=deleteOption; window.addOption=addOption; window.editNote=editNote; window.fixDropdowns=fixDropdowns; window.toggleBatchMode=toggleBatchMode; window.toggleSelectAll=toggleSelectAll; window.toggleSelectOne=toggleSelectOne; window.deleteSelected=deleteSelected; window.toggleMoldParams=toggleMoldParams; window.saveMoldConfig=saveMoldConfig; window.getMoldMode=getMoldMode; window.saveMoldMode=saveMoldMode; window.getMoldFixedAmount=getMoldFixedAmount; window.saveMoldFixedAmount=saveMoldFixedAmount; window.getMoldDiscountMultiplier=getMoldDiscountMultiplier; window.saveMoldDiscountMultiplier=saveMoldDiscountMultiplier; window.exportStandaloneHTML=exportStandaloneHTML; window.sortByCategory=sortByCategory; window.resetSortOrder=resetSortOrder; window.dragStart=dragStart; window.dragOver=dragOver; window.drop=drop; window.dragEnd=dragEnd; window.refreshPrices=refreshPrices; window.saveTermsFromModal=saveTermsFromModal;

        // ========== 自我修复机制 ==========
        function autoRepair(){ 
            if(!document.getElementById('navContainer')) console.error('navContainer missing'); 
            const closeBtn=document.getElementById('modalClose'); 
            if(closeBtn) closeBtn.onclick=()=>document.getElementById('itemModal').classList.remove('open'); 
            // 全局强制修复下拉框
            document.querySelectorAll('select').forEach(sel => {
                sel.disabled = false;
                sel.style.pointerEvents = 'auto';
                sel.style.zIndex = '10';
                sel.style.position = 'relative';
                sel.style.appearance = 'auto';
                sel.style.webkitAppearance = 'auto';
            });
        }
        window.addEventListener('DOMContentLoaded',function(){ autoRepair(); });
        window.addEventListener('error',function(e){ console.error('捕获到错误:',e.message); showToast('⚠️ 发生错误：'+e.message); });

        console.log('🍮 '+getWorkbenchName()+'工作室 · 排单工作台已启动！');
        console.log('当前订单数:',data.orders.length);
        console.log('价目表条目:',data.priceList.length);
    </script>
</body>
</html>
