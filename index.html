<!DOCTYPE html>
<html lang="zh-CN" data-theme="mist-blue">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>测试工作室 · 排单工作台</title>
    <style>
        /* ============================================================ */
        /*  配色方案（通过 data-theme 切换）                             */
        /* ============================================================ */
        [data-theme="mist-blue"] {
            --primary: #ABC0D1; --primary-light: #DCECED; --primary-dark: #8DA8BD;
            --bg: #F2F6F8; --text: #3D4A5A; --text-secondary: #7A8FA0;
            --border: #D6E2EA; --shadow: 0 2px 16px rgba(171,192,209,0.22);
            --tag-bg: #DCECED; --card-hover: #F7FAFC;
            --entry-gradient-start: #DCECED; --entry-gradient-end: #C6D8E6;
            --toast-bg: #3D4A5A; --btn-primary-hover: #8DA8BD;
            --delete-color: #D48A8A; --delete-hover: #C07070; --card-bg: #FFFFFF;
        }
        [data-theme="rose-pink"] {
            --primary: #E8D5D9; --primary-light: #F5E6E8; --primary-dark: #D4B5B8;
            --bg: #FAF5F4; --text: #4A3D3D; --text-secondary: #9A8080;
            --border: #E8D8D8; --shadow: 0 2px 16px rgba(232,213,217,0.25);
            --tag-bg: #F5E6E8; --card-hover: #FCF7F6;
            --entry-gradient-start: #F5E6E8; --entry-gradient-end: #E8D5D9;
            --toast-bg: #4A3D3D; --btn-primary-hover: #D4B5B8;
            --delete-color: #D48A8A; --delete-hover: #C07070; --card-bg: #FFFFFF;
        }
        [data-theme="cream"] {
            --primary: #E8DDD0; --primary-light: #F5EDE3; --primary-dark: #D0C0B0;
            --bg: #F8F4EE; --text: #4A4038; --text-secondary: #9A8A7A;
            --border: #E8E0D8; --shadow: 0 2px 16px rgba(232,221,208,0.25);
            --tag-bg: #F5EDE3; --card-hover: #FCF9F5;
            --entry-gradient-start: #F5EDE3; --entry-gradient-end: #E8DDD0;
            --toast-bg: #4A4038; --btn-primary-hover: #D0C0B0;
            --delete-color: #C0A090; --delete-hover: #A08070; --card-bg: #FFFFFF;
        }
        [data-theme="gray-purple"] {
            --primary: #C9B1D0; --primary-light: #E8DCE8; --primary-dark: #B098B8;
            --bg: #F5F0F5; --text: #3D3A4A; --text-secondary: #8A7A9A;
            --border: #DCD0E0; --shadow: 0 2px 16px rgba(201,177,208,0.22);
            --tag-bg: #E8DCE8; --card-hover: #FAF7FA;
            --entry-gradient-start: #E8DCE8; --entry-gradient-end: #D5C8D9;
            --toast-bg: #3D3A4A; --btn-primary-hover: #B098B8;
            --delete-color: #C0A0B0; --delete-hover: #A08090; --card-bg: #FFFFFF;
        }
        [data-theme="matcha"] {
            --primary: #C0D0C0; --primary-light: #E4ECE4; --primary-dark: #A8B8A8;
            --bg: #F4F8F2; --text: #3A4A3A; --text-secondary: #7A8A7A;
            --border: #D8E0D8; --shadow: 0 2px 16px rgba(192,208,192,0.22);
            --tag-bg: #E4ECE4; --card-hover: #F9FBF8;
            --entry-gradient-start: #E4ECE4; --entry-gradient-end: #D4E0D6;
            --toast-bg: #3A4A3A; --btn-primary-hover: #A8B8A8;
            --delete-color: #A0B090; --delete-hover: #809070; --card-bg: #FFFFFF;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --radius:14px; --sidebar-width:210px; --header-height:60px;
            --font:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --card-bg:#FFFFFF;
        }
        body { font-family:var(--font); background:var(--bg); color:var(--text); height:100vh; overflow:hidden; transition:background .3s,color .3s; }
        ::-webkit-scrollbar { width:5px; height:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--primary); border-radius:20px; }

       
        /* 名称显示截断与防换行优化 */
        .logo, .entry-page .logo-big {
            flex-wrap: nowrap !important; /* 强制不换行，防止“工作台”掉下去 */
        }
        
        /* 名称允许收缩并显示省略号 */
        .logo-name, .entry-page .logo-big .logo-name, .rename-area .left-section .name-display {
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
            flex-shrink: 1; /* 允许名称在空间不足时自动收缩 */
            min-width: 0;
        }
        
        /* 侧边栏的名称最大宽度，保证3个字能显示，且不挤压徽章 */
        .logo-name { max-width: 75px; } 
        /* 入口页面的名称可以更宽 */
        .entry-page .logo-big .logo-name { max-width: 200px; } 
        
        /* 强制“工作台”徽章不被挤压、不换行 */
        .logo .logo-badge, .entry-page .logo-big .logo-badge {
            flex-shrink: 0; 
            white-space: nowrap;
        }
        
        @media (max-width:768px) {
            .logo-name { max-width:80px; font-size:16px !important; }
            .entry-page .logo-big .logo-name { max-width:120px; font-size:28px !important; }
        }

        /* 入口页面 */
        .entry-page { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:linear-gradient(135deg,var(--entry-gradient-start) 0%,var(--entry-gradient-end) 100%); padding:20px; transition:background .5s; }
        .entry-page .logo-big { font-size:52px; font-weight:700; color:var(--text); margin-bottom:8px; letter-spacing:-1px; display:flex; align-items:center; gap:12px; }
        .entry-page .logo-big .logo-icon { font-size:48px; line-height:1; }
        .entry-page .logo-big .logo-badge { background:var(--primary); color:#fff; font-size:16px; border-radius:40px; padding:2px 14px; font-weight:500; margin-left:4px; }
        .entry-page .subtitle { font-size:16px; color:var(--text-secondary); margin-bottom:40px; }
        .entry-cards { display:flex; gap:30px; flex-wrap:wrap; justify-content:center; }
        .entry-card { background:#fff; border-radius:20px; padding:40px 44px 36px; box-shadow:var(--shadow); text-align:center; width:240px; cursor:pointer; transition:all .25s ease; border:2px solid transparent; }
        .entry-card:hover { transform:translateY(-6px); box-shadow:0 16px 48px rgba(0,0,0,.08); border-color:var(--primary); }
        .entry-card .icon-big { font-size:48px; margin-bottom:12px; }
        .entry-card h3 { font-size:20px; font-weight:600; margin-bottom:6px; }
        .entry-card p { font-size:13px; color:var(--text-secondary); line-height:1.5; }
        .entry-card .badge { display:inline-block; margin-top:10px; font-size:11px; background:var(--tag-bg); color:var(--text-secondary); padding:2px 14px; border-radius:30px; font-weight:500; }

        /* 登录模态框 */
        .login-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.25); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:9999; }
        .login-overlay.open { display:flex; }
        .login-box { background:#fff; border-radius:24px; padding:40px 44px 36px; max-width:380px; width:92%; box-shadow:0 20px 60px rgba(0,0,0,.1); animation:modalIn .25s ease; }
        @keyframes modalIn { from { opacity:0; transform:scale(.95) translateY(16px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .login-box h2 { font-size:22px; font-weight:700; margin-bottom:4px; color:var(--text); }
        .login-box .login-sub { font-size:14px; color:var(--text-secondary); margin-bottom:24px; }
        .login-box .form-group { margin-bottom:16px; }
        .login-box .form-group label { display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:4px; }
        .login-box .form-group input { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:15px; font-family:var(--font); transition:.15s; background:#fff; color:var(--text); }
        .login-box .form-group input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(171,192,209,.25); }
        .login-box .login-error { color:var(--delete-color); font-size:13px; margin-bottom:12px; min-height:20px; }
        .login-box .btn-primary { width:100%; padding:11px; border:none; border-radius:30px; background:var(--primary); color:#fff; font-size:16px; font-weight:600; cursor:pointer; transition:.15s; }
        .login-box .btn-primary:hover { background:var(--btn-primary-hover); box-shadow:0 6px 16px rgba(0,0,0,.1); }
        .login-box .btn-outline { width:100%; margin-top:10px; padding:10px; border:1.5px solid var(--border); border-radius:30px; background:transparent; color:var(--text-secondary); font-size:14px; font-weight:500; cursor:pointer; transition:.15s; }
        .login-box .btn-outline:hover { background:var(--bg); }

        /* 应用容器 */
        .app-container { display:none; height:100vh; overflow:hidden; }
        .app-container.active { display:flex; }

        /* 侧边栏 */
        .sidebar { width:var(--sidebar-width); background:var(--card-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:24px 0 20px 0; flex-shrink:0; height:100vh; position:relative; z-index:10; transition:background .3s,border-color .3s; }
        .logo { font-size:22px; font-weight:700; padding:0 16px 28px 16px; letter-spacing:-.3px; color:var(--text); display:flex; align-items:center; gap:6px; }
        .logo .logo-icon { font-size:26px; line-height:1; }
        .logo .logo-badge { background:var(--primary); color:#fff; font-size:11px; border-radius:40px; padding:0 10px; line-height:20px; font-weight:500; }
        .nav { flex:1; display:flex; flex-direction:column; gap:2px; padding:0 12px; }
        .nav-item { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:10px; cursor:pointer; transition:all .15s ease; font-size:14px; font-weight:500; color:var(--text-secondary); border:none; background:transparent; width:100%; text-align:left; }
        .nav-item:hover { background:var(--primary-light); color:var(--text); }
        .nav-item.active { background:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.08); }
        .nav-item .icon { font-size:18px; width:24px; text-align:center; flex-shrink:0; }

        /* 主内容 */
        .main { flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; background:var(--bg); transition:background .3s; }
        .header { height:var(--header-height); background:var(--card-bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 32px; flex-shrink:0; justify-content:space-between; }
        .header h2 { font-size:18px; font-weight:600; }
        .header .sub { font-size:13px; color:var(--text-secondary); font-weight:400; margin-left:12px; }
        .header-actions { display:flex; gap:12px; align-items:center; }
        .header-actions .mode-tag { font-size:12px; background:var(--primary-light); color:var(--text-secondary); padding:4px 14px; border-radius:30px; font-weight:500; }
        .header-actions .logout-btn { font-size:12px; background:#E8D8D8; color:#A08080; padding:4px 14px; border-radius:30px; font-weight:500; border:none; cursor:pointer; transition:.15s; }
        .header-actions .logout-btn:hover { background:#DCC8C8; }
        .content { flex:1; overflow-y:auto; padding:28px 32px 32px 32px; }

        /* 卡片 */
        .card { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px 28px; margin-bottom:24px; transition:background .3s,box-shadow .3s; }
        .card-title { font-size:16px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .card-title .action-btn { font-size:13px; font-weight:400; color:var(--primary-dark); cursor:pointer; background:none; border:none; }
        .card-title .action-btn:hover { text-decoration:underline; }

        /* 统计卡片 */
        .stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:8px; }
        .stat-card { background:var(--card-bg); border-radius:var(--radius); padding:22px 26px; box-shadow:var(--shadow); border-left:4px solid var(--primary); transition:background .3s,border-color .3s,box-shadow .3s; }
        .stat-card .label { font-size:13px; color:var(--text-secondary); font-weight:500; }
        .stat-card .value { font-size:32px; font-weight:700; margin-top:4px; letter-spacing:-.5px; }
        .stat-card .value small { font-size:16px; font-weight:400; color:var(--text-secondary); margin-left:6px; }
        .stat-card .sub-info { font-size:13px; color:var(--text-secondary); margin-top:6px; }
        .stat-card .jump-btn { margin-top:12px; display:inline-block; background:var(--primary-light); color:var(--text-secondary); padding:4px 16px; border-radius:30px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:background .3s,color .3s; }
        .stat-card .jump-btn:hover { background:var(--primary); color:#fff; }

        /* 表格 */
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        th { text-align:left; padding:10px 12px; background:var(--bg); font-weight:600; color:var(--text-secondary); font-size:12px; text-transform:uppercase; letter-spacing:.3px; border-bottom:2px solid var(--border); white-space:nowrap; }
        td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
        tr:hover td { background:var(--card-hover); }

        /* 行内编辑 */
        .editable-cell { cursor:pointer; padding:4px 6px; border-radius:6px; transition:background .15s; min-height:28px; display:inline-block; width:100%; }
        .editable-cell:hover { background:var(--primary-light); }
        .editable-cell .inline-input { width:100%; padding:4px 6px; border:2px solid var(--primary); border-radius:6px; font-size:14px; font-family:var(--font); background:#fff; outline:none; box-shadow:0 0 0 3px rgba(171,192,209,.2); color:var(--text); }
        .editable-cell .inline-select { width:100%; padding:4px 6px; border:2px solid var(--primary); border-radius:6px; font-size:14px; font-family:var(--font); background:#fff; outline:none; box-shadow:0 0 0 3px rgba(171,192,209,.2); color:var(--text); }

        /* 状态标签 */
        .status-badge { font-size:12px; padding:2px 12px; border-radius:30px; background:var(--primary-light); color:var(--text-secondary); display:inline-block; }
        .status-badge.done { background:#D4E8D4; color:#4A7A4A; }
        .status-badge.pending { background:#F0E8C8; color:#9A8A5A; }

        /* 按钮 */
        .btn-sm { padding:4px 12px; border-radius:30px; border:none; font-size:12px; cursor:pointer; background:var(--border); color:var(--text-secondary); transition:.15s; }
        .btn-sm:hover { background:var(--primary-light); color:var(--text); }
        .btn-sm.danger:hover { background:var(--delete-color); color:#fff; }

        /* 表单 */
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; color:var(--text-secondary); }
        .form-group label .required { color:var(--delete-color); margin-left:2px; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:9px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:var(--font); transition:.15s; background:#fff; color:var(--text); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(171,192,209,.2); }
        .form-group textarea { resize:vertical; min-height:60px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:18px; }

        /* 主要按钮 */
        .btn-primary { background:var(--primary); color:#fff; border:none; padding:10px 28px; border-radius:30px; font-size:15px; font-weight:600; cursor:pointer; transition:.15s; }
        .btn-primary:hover { background:var(--btn-primary-hover); transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.08); }
        .btn-outline { background:transparent; color:var(--text-secondary); border:1.5px solid var(--border); padding:8px 22px; border-radius:30px; font-size:14px; font-weight:500; cursor:pointer; transition:.15s; }
        .btn-outline:hover { background:var(--primary-light); border-color:var(--primary); }

        /* 日历 */
        .calendar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .calendar-header .month-label { font-size:20px; font-weight:700; }
        .calendar-header .month-label .count { font-size:14px; font-weight:400; color:var(--text-secondary); margin-left:10px; }
        .calendar-nav { display:flex; gap:8px; }
        .calendar-nav button { background:var(--card-bg); border:1px solid var(--border); border-radius:30px; padding:4px 16px; cursor:pointer; font-size:14px; transition:.15s; color:var(--text); }
        .calendar-nav button:hover { background:var(--primary-light); border-color:var(--primary); }
        .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
        .calendar-grid .day-label { font-size:12px; font-weight:600; color:var(--text-secondary); text-align:center; padding:8px 0; }
        .calendar-grid .day-cell { background:var(--card-bg); border-radius:10px; padding:8px 6px; min-height:70px; border:1px solid var(--border); transition:background .3s,border-color .3s; position:relative; }
        .calendar-grid .day-cell.empty { background:transparent; border:1px solid transparent; }
        .calendar-grid .day-cell .day-number { font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:4px; }
        .calendar-grid .day-cell .event { font-size:11px; background:var(--primary-light); color:var(--text-secondary); padding:1px 6px; border-radius:6px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
        .calendar-grid .day-cell.today { border-color:var(--primary); background:var(--card-hover); }
        .calendar-grid .day-cell.has-event { border-color:var(--primary); }

        /* 模态框 */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.25); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:1000; }
        .modal-overlay.open { display:flex; }
        .modal { background:#fff; border-radius:18px; max-width:860px; width:94%; max-height:85vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.1); animation:modalIn .2s ease; }
        .modal-header { padding:20px 26px 12px 26px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
        .modal-header h3 { font-size:18px; font-weight:600; color:var(--text); }
        .modal-close { background:none; border:none; font-size:26px; cursor:pointer; color:var(--text-secondary); line-height:1; }
        .modal-close:hover { color:var(--delete-color); }
        .modal-body { padding:20px 26px; overflow-y:auto; flex:1; }
        .modal-footer { padding:14px 26px 22px 26px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:12px; flex-shrink:0; }

        /* 制品填写表（模态框内） */
        .item-row { display:grid; grid-template-columns:1.1fr 0.6fr 0.7fr 0.7fr 0.7fr 0.7fr 0.8fr 0.8fr 0.6fr; gap:6px; align-items:center; margin-bottom:6px; font-size:13px; } /* 增加备注列 */
        .item-row.header { font-weight:600; color:var(--text-secondary); font-size:12px; margin-bottom:10px; }
        .item-row input, .item-row select { padding:5px 6px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:var(--font); width:100%; background:#fff; color:var(--text); }
        .item-row input:focus, .item-row select:focus { outline:none; border-color:var(--primary); }
        .item-row .remove-item { background:none; border:none; color:var(--delete-color); cursor:pointer; font-size:18px; line-height:1; padding:0 4px; }
        .item-row .remove-item:hover { color:var(--delete-hover); }
        .total-summary { margin-top:16px; text-align:right; font-size:16px; font-weight:600; }
        .total-summary span { color:var(--primary-dark); font-size:20px; }

        /* ⭐ 修复下拉框点不动：强制激活原生样式和点击层级 */
        .item-row input, .item-row select {
            pointer-events: auto !important;
            position: relative;
            z-index: 10;
            -webkit-appearance: auto;
            appearance: auto;
        }

        /* Toast */
        .toast { position:fixed; bottom:30px; right:30px; background:var(--toast-bg); color:#fff; padding:14px 26px; border-radius:14px; font-size:14px; box-shadow:0 8px 30px rgba(0,0,0,.15); z-index:2000; opacity:0; transform:translateY(20px); transition:.3s; }
        .toast.show { opacity:1; transform:translateY(0); }

        /* 空状态 */
        .empty-state { text-align:center; padding:40px 0; color:var(--text-secondary); }
        .empty-state .big-icon { font-size:48px; margin-bottom:12px; }

        /* 搜索框 */
        .search-box { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
        .search-box input { flex:1; min-width:200px; padding:9px 16px; border:1.5px solid var(--border); border-radius:30px; font-size:14px; background:#fff; color:var(--text); }
        .search-box input:focus { outline:none; border-color:var(--primary); }

        /* 管理端设置区域 */
        .admin-terms-box { background:var(--primary-light); border:1px solid var(--border); border-radius:12px; padding:16px 20px; margin-bottom:18px; }
        .admin-terms-box .header-row { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        .admin-terms-box .header-row strong { color:var(--text); }
        .admin-terms-box .terms-preview { font-size:13px; color:var(--text-secondary); margin-top:8px; background:#fff; padding:10px 14px; border-radius:8px; max-height:100px; overflow-y:auto; white-space:pre-line; line-height:1.6; }

        /* 选项编辑器 */
        .option-editor { margin-top:6px; padding:10px 14px; background:var(--bg); border-radius:10px; border:1px dashed var(--border); }
        .option-editor .option-item { display:flex; align-items:center; gap:8px; padding:4px 0; flex-wrap:wrap; }
        .option-editor .option-item .opt-label { font-weight:500; color:var(--text); cursor:pointer; padding:2px 8px; border-radius:4px; transition:background .15s; }
        .option-editor .option-item .opt-label:hover { background:var(--primary-light); }
        .option-editor .option-item .opt-multiplier { font-weight:600; color:var(--primary-dark); cursor:pointer; padding:2px 8px; border-radius:4px; transition:background .15s; }
        .option-editor .option-item .opt-multiplier:hover { background:var(--primary-light); }
        .option-editor .option-item .opt-delete { color:var(--delete-color); cursor:pointer; font-size:14px; padding:0 4px; }
        .option-editor .option-item .opt-delete:hover { color:var(--delete-hover); }
        .option-editor .add-option-btn { margin-top:6px; font-size:12px; color:var(--text-secondary); cursor:pointer; padding:2px 12px; border:1px dashed var(--border); border-radius:30px; display:inline-block; transition:.15s; }
        .option-editor .add-option-btn:hover { background:var(--primary-light); border-color:var(--primary); }
        .option-editor .option-note { font-size:12px; color:var(--text-secondary); margin-top:4px; padding:4px 8px; border-radius:4px; cursor:pointer; }
        .option-editor .option-note:hover { background:var(--primary-light); }
        .option-editor .empty-hint { font-size:12px; color:var(--text-secondary); padding:4px 0; }
        .option-editor-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:10px; }
        @media (max-width:768px) { .option-editor-grid { grid-template-columns:1fr 1fr; } }
        @media (max-width:480px) { .option-editor-grid { grid-template-columns:1fr; } }

        /* 修改密码区域 */
        .change-pwd-area { background:var(--primary-light); border-radius:12px; padding:16px 20px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
        .change-pwd-area .label { font-size:14px; font-weight:500; color:var(--text-secondary); }
        .change-pwd-area .label strong { color:var(--text); }
        .data-transfer-area { background:var(--primary-light); border-radius:12px; padding:16px 20px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
        .data-transfer-area .label { font-size:14px; font-weight:500; color:var(--text-secondary); }
        .data-transfer-area .label .sub { font-size:12px; font-weight:400; display:block; }
        .data-transfer-area .btn-group { display:flex; gap:10px; flex-wrap:wrap; }
        .data-transfer-area .btn-group .btn-sm { padding:6px 18px; font-weight:500; }
        .data-transfer-area .btn-group .btn-sm.import-btn { background:var(--primary); color:#fff; }
        .data-transfer-area .btn-group .btn-sm.import-btn:hover { background:var(--btn-primary-hover); }
        .data-transfer-area .btn-group .btn-sm.export-btn { background:var(--primary-light); color:var(--text-secondary); }
        .data-transfer-area .btn-group .btn-sm.export-btn:hover { background:var(--border); }
        .data-transfer-area .btn-group .btn-sm.standalone-export-btn { background:#8DA8BD; color:#fff; }
        .data-transfer-area .btn-group .btn-sm.standalone-export-btn:hover { background:#6F8DA8; }

        .rename-area { background:var(--card-bg); border-radius:16px; padding:20px 24px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; box-shadow:var(--shadow); border-left:4px solid var(--primary); }
        .rename-area .left-section { display:flex; align-items:center; gap:14px; }
        .rename-area .left-section .label-icon { font-size:28px; line-height:1; }
        .rename-area .left-section .label-text { font-size:13px; color:var(--text-secondary); font-weight:500; }
        .rename-area .left-section .name-display { font-size:26px; font-weight:700; color:var(--text); background:var(--primary-light); padding:2px 18px; border-radius:10px; letter-spacing:1px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .rename-area .left-section .sync-hint { font-size:12px; color:var(--text-secondary); font-weight:400; margin-left:4px; }
        .rename-area .btn-group { display:flex; gap:10px; flex-wrap:wrap; }
        .rename-area .btn-group .btn-sm { padding:8px 22px; font-weight:500; font-size:13px; }
        .rename-area .btn-group .btn-sm.rename-btn { background:var(--primary); color:#fff; }
        .rename-area .btn-group .btn-sm.rename-btn:hover { background:var(--btn-primary-hover); }

        .theme-switcher-area { background:var(--card-bg); border-radius:16px; padding:18px 24px; margin-bottom:18px; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
        .theme-switcher-area .label { font-size:14px; font-weight:500; color:var(--text-secondary); display:flex; align-items:center; gap:8px; }
        .theme-switcher-area .label .label-icon { font-size:20px; }
        .theme-switcher-area .theme-options { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
        .theme-option { display:flex; align-items:center; gap:6px; padding:5px 14px 5px 10px; border-radius:30px; cursor:pointer; border:2px solid transparent; transition:all .2s ease; background:var(--bg); font-size:12px; font-weight:500; color:var(--text-secondary); }
        .theme-option:hover { border-color:var(--border); background:var(--primary-light); }
        .theme-option.active { border-color:var(--primary); background:var(--primary-light); color:var(--text); }
        .theme-option .color-dots { display:flex; gap:4px; align-items:center; }
        .theme-option .color-dot { width:16px; height:16px; border-radius:50%; border:1px solid rgba(0,0,0,.06); flex-shrink:0; }
        .theme-option .theme-label { font-size:12px; font-weight:500; }

        .submitted-overlay { background:var(--primary-light); border-radius:12px; padding:20px; text-align:center; margin-top:16px; }
        .submitted-overlay .check-icon { font-size:48px; margin-bottom:8px; }
        .submitted-overlay .msg { font-size:16px; font-weight:600; color:var(--text); }
        .submitted-overlay .sub-msg { font-size:13px; color:var(--text-secondary); margin-top:4px; }

        .form-disabled input:disabled, .form-disabled select:disabled, .form-disabled textarea:disabled { background:var(--bg); cursor:not-allowed; opacity:.7; }
        .form-disabled .btn-primary { display:none; }
        #fileInput { display:none; }

        /* 批量删除 */
        .batch-controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; padding:10px 14px; background:var(--primary-light); border-radius:10px; }
        .batch-controls .btn-sm.batch-delete-btn { background:var(--delete-color); color:#fff; }
        .batch-controls .btn-sm.batch-delete-btn:hover { background:var(--delete-hover); }
        .batch-controls .btn-sm.batch-cancel-btn { background:var(--border); color:var(--text-secondary); }
        .batch-controls .btn-sm.batch-cancel-btn:hover { background:var(--bg); }

        /* 返回首页 */
        .back-home-section { margin-top:20px; padding-top:18px; border-top:2px dashed var(--border); display:flex; justify-content:center; }
        .back-home-section .btn-back-home { background:var(--primary-light); color:var(--text-secondary); border:1.5px solid var(--border); padding:8px 28px; border-radius:30px; font-size:14px; font-weight:500; cursor:pointer; transition:.2s; display:inline-flex; align-items:center; gap:8px; }
        .back-home-section .btn-back-home:hover { background:var(--primary); color:#fff; border-color:var(--primary); transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.08); }

        /* 修复下拉框 */
        .fix-dropdown-area { background:#FFF0E0; border-radius:12px; padding:14px 20px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; border:1px solid #F0C0A0; }
        .fix-dropdown-area .label { font-size:14px; font-weight:500; color:#B08060; }
        .fix-dropdown-area .btn-group .btn-sm { padding:6px 20px; font-weight:500; }
        .fix-dropdown-area .btn-group .btn-sm.fix-btn { background:#E08040; color:#fff; }
        .fix-dropdown-area .btn-group .btn-sm.fix-btn:hover { background:#C07030; }

        /* 拖拽排序 */
        .drag-handle { cursor:grab; color:var(--text-secondary); font-size:16px; user-select:none; padding:4px 6px; border-radius:4px; transition:background .2s; display:inline-block; line-height:1; }
        .drag-handle:hover { background:var(--primary-light); color:var(--text); }
        .drag-handle:active { cursor:grabbing; }
        tr.dragging { opacity:.5; background:var(--primary-light); }
        tr.drag-over td { border-bottom:2px solid var(--primary); }
        .sort-controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
        .sort-controls .btn-sm.sort-btn { background:var(--primary-light); color:var(--text-secondary); padding:4px 16px; }
        .sort-controls .btn-sm.sort-btn:hover { background:var(--primary); color:#fff; }
        .sort-controls .sort-label { font-size:13px; color:var(--text-secondary); font-weight:500; }

        /* 响应式 */
        @media (max-width:768px) {
            .sidebar { width:60px; padding:12px 0; }
            .logo { padding:0 12px 16px 12px; font-size:0; }
            .logo .logo-icon { font-size:24px; }
            .logo .logo-name, .logo .logo-badge { display:none; }
            .nav-item { padding:10px 12px; justify-content:center; }
            .nav-item .label { display:none; }
            .stats-grid { grid-template-columns:1fr; }
            .form-row { grid-template-columns:1fr; }
            .content { padding:16px; }
            .header { padding:0 16px; }
            .header h2 { font-size:15px; }
            .header .sub { font-size:11px; margin-left:6px; }
            .entry-cards { flex-direction:column; align-items:center; }
            .entry-card { width:100%; max-width:280px; }
            .item-row { grid-template-columns:1fr 1fr; gap:4px; background:var(--card-hover); padding:10px; border-radius:8px; margin-bottom:10px; }
            .item-row.header { display:none; }
            .calendar-grid .day-cell { min-height:50px; padding:4px; }
            .calendar-grid .day-cell .day-number { font-size:11px; }
            .calendar-grid .day-cell .event { font-size:9px; padding:1px 4px; }
            .login-box { padding:30px 24px 28px; }
            .change-pwd-area, .data-transfer-area, .rename-area, .theme-switcher-area, .fix-dropdown-area { flex-direction:column; align-items:stretch; text-align:center; }
            .data-transfer-area .btn-group, .rename-area .btn-group, .theme-switcher-area .theme-options { justify-content:center; }
            .batch-controls { flex-direction:column; align-items:stretch; text-align:center; }
            .batch-controls .btn-group { justify-content:center; }
        }
        @media (max-width:480px) {
            .rename-area .left-section .name-display { font-size:18px; padding:2px 12px; }
            .theme-option { padding:3px 10px 3px 8px; font-size:11px; }
            .theme-option .color-dot { width:14px; height:14px; }
            .option-editor-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>

    <!-- 入口页面 -->
    <div class="entry-page" id="entryPage">
        <div class="logo-big" id="entryLogo">
            <span class="logo-icon">📋</span>
            <span class="logo-name" id="entryName">测试</span>
            <span class="logo-badge">工作台</span>
        </div>
        <p class="subtitle">专业的双端接稿管理系统</p>
        <div class="entry-cards">
            <div class="entry-card admin-card" onclick="openLogin()">
                <div class="icon-big">🛠️</div><h3>管理员入口</h3>
                <p>管理价目、订单、排期与统计</p><div class="badge">需密码验证</div>
            </div>
            <div class="entry-card client-card" onclick="enterClientMode()">
                <div class="icon-big">👤</div><h3>客户入口</h3>
                <p>查看价目表、档期，提交约稿</p><div class="badge">免登录</div>
            </div>
        </div>
        <p style="margin-top:30px;font-size:13px;color:var(--text-secondary);">管理员登录后可完整操作订单与排期；客户入口无需登录即可浏览与提交。</p>
    </div>

    <!-- 登录模态框 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔐 管理员登录</h2>
            <p class="login-sub">请输入管理员密码以访问工作台</p>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" onkeydown="if(event.key==='Enter') doLogin()" />
            </div>
            <div class="login-error" id="loginError"></div>
            <button class="btn-primary" onclick="doLogin()">登 录</button>
            <button class="btn-outline" onclick="closeLogin()">返回</button>
        </div>
    </div>

    <!-- 应用主体 -->
    <div class="app-container" id="appContainer">
        <aside class="sidebar" id="sidebar">
            <div class="logo" id="sidebarLogo">
                <span class="logo-icon">📋</span>
                <span class="logo-name" id="sidebarName">测试</span>
                <span class="logo-badge">工作台</span>
            </div>
            <nav class="nav" id="navContainer"></nav>
        </aside>
        <div class="main">
            <header class="header">
                <h2 id="pageTitle">首页 <span class="sub" id="pageSub">仪表盘</span></h2>
                <div class="header-actions">
                    <span class="mode-tag" id="modeTag">🛠️ 管理端</span>
                    <button class="logout-btn" onclick="logout()">退出</button>
                </div>
            </header>
            <div class="content" id="appContent"></div>
        </div>
    </div>

    <!-- 制品模态框 -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal">
            <div class="modal-header"><h3>🧾 制品填写表</h3><button class="modal-close" id="modalClose">&times;</button></div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-outline" id="modalCancel">取消</button>
                <button class="btn-primary" id="modalConfirm">✅ 确认制品</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
    <input type="file" id="fileInput" accept=".json" />

    <script>
        // ========== 选项配置管理 ==========
        const DEFAULT_PURPOSE_OPTIONS = [
            { id: 'p1', label: '无料（≤200份）', multiplier: 1 },
            { id: 'p2', label: '无料（>200份）', multiplier: 1.5 },
            { id: 'p3', label: '商业', multiplier: 2 },
            { id: 'p4', label: '买断', multiplier: 3 }
        ];
        const DEFAULT_SCHEDULE_OPTIONS = [
            { id: 's1', label: '插排期', multiplier: 1.5 },
            { id: 's2', label: '钞位置', multiplier: 2 }
        ];
        const DEFAULT_URGENT_OPTIONS = [
            { id: 'u1', label: '无', multiplier: 1 },
            { id: 'u2', label: '加急7天', multiplier: 2 },
            { id: 'u3', label: '加急48h', multiplier: 2.5 },
            { id: 'u4', label: '加急24h', multiplier: 3 }
        ];
        const PURPOSE_KEY = 'buding_purpose_options';
        const SCHEDULE_KEY = 'buding_schedule_options';
        const URGENT_KEY = 'buding_urgent_options';
        const SCHEDULE_NOTE_KEY = 'buding_schedule_note';

        function getPurposeOptions() { try { const raw = localStorage.getItem(PURPOSE_KEY); if (raw) return JSON.parse(raw); } catch(e) {} return DEFAULT_PURPOSE_OPTIONS; }
        function savePurposeOptions(options) { localStorage.setItem(PURPOSE_KEY, JSON.stringify(options)); }
        function getScheduleOptions() { try { const raw = localStorage.getItem(SCHEDULE_KEY); if (raw) return JSON.parse(raw); } catch(e) {} return DEFAULT_SCHEDULE_OPTIONS; }
        function saveScheduleOptions(options) { localStorage.setItem(SCHEDULE_KEY, JSON.stringify(options)); }
        function getUrgentOptions() { try { const raw = localStorage.getItem(URGENT_KEY); if (raw) return JSON.parse(raw); } catch(e) {} return DEFAULT_URGENT_OPTIONS; }
        function saveUrgentOptions(options) { localStorage.setItem(URGENT_KEY, JSON.stringify(options)); }
        function getScheduleNote() { const stored = localStorage.getItem(SCHEDULE_NOTE_KEY); return stored || '*钞的只是位置，不是加急做。插排期是插在某个月份空余时间制作，ddl为当月月底。'; }
        function saveScheduleNote(note) { localStorage.setItem(SCHEDULE_NOTE_KEY, note); }
        function getOptionsByType(type) { if (type==='purpose') return getPurposeOptions(); if (type==='schedule') return getScheduleOptions(); if (type==='urgent') return getUrgentOptions(); return []; }
        function saveOptionsByType(type, options) { if (type==='purpose') savePurposeOptions(options); if (type==='schedule') saveScheduleOptions(options); if (type==='urgent') saveUrgentOptions(options); }
        function getOptionMultiplier(options, id) { if (!options || options.length===0) return 1; const found = options.find(o=>o.id===id); return found ? found.multiplier : 1; }
        function calcFinalMultiplier(purposeId, scheduleId, urgentId) {
            const purposeOpts = getPurposeOptions(), scheduleOpts = getScheduleOptions(), urgentOpts = getUrgentOptions();
            return getOptionMultiplier(purposeOpts, purposeId) * getOptionMultiplier(scheduleOpts, scheduleId) * getOptionMultiplier(urgentOpts, urgentId);
        }

        // ========== 同模减价配置 ==========
        const MOLD_MODE_KEY = 'buding_mold_mode';
        const MOLD_FIXED_KEY = 'buding_mold_fixed_amount';
        const MOLD_DISCOUNT_KEY = 'buding_mold_discount_multiplier';
        const DEFAULT_MOLD_MODE = 'fixed';
        const DEFAULT_MOLD_FIXED = 10;
        const DEFAULT_MOLD_DISCOUNT = 0.5;
        function getMoldMode() { const val = localStorage.getItem(MOLD_MODE_KEY); return (val==='fixed'||val==='discount')?val:DEFAULT_MOLD_MODE; }
        function saveMoldMode(mode) { if (mode==='fixed'||mode==='discount') localStorage.setItem(MOLD_MODE_KEY,mode); }
        function getMoldFixedAmount() { const val=parseFloat(localStorage.getItem(MOLD_FIXED_KEY)); return isNaN(val)?DEFAULT_MOLD_FIXED:Math.max(0,val); }
        function saveMoldFixedAmount(amount) { localStorage.setItem(MOLD_FIXED_KEY, String(Math.max(0,amount))); }
        function getMoldDiscountMultiplier() { const val=parseFloat(localStorage.getItem(MOLD_DISCOUNT_KEY)); if (!isNaN(val)&&val>=0&&val<=1) return val; return DEFAULT_MOLD_DISCOUNT; }
        function saveMoldDiscountMultiplier(val) { localStorage.setItem(MOLD_DISCOUNT_KEY, String(Math.min(1,Math.max(0,val)))); }

        // ========== 选项编辑器操作 ==========
        function editOptionLabel(type, id) { if (!isAdmin) return; const options=getOptionsByType(type); const opt=options.find(o=>o.id===id); if (!opt) return; const newLabel=prompt('修改选项名称：', opt.label); if (newLabel!==null && newLabel.trim()) { opt.label=newLabel.trim(); saveOptionsByType(type,options); renderContent(); showToast('✅ 已更新'); } }
        function editOptionMultiplier(type, id) { if (!isAdmin) return; const options=getOptionsByType(type); const opt=options.find(o=>o.id===id); if (!opt) return; const newMult=parseFloat(prompt('修改倍数：', opt.multiplier)); if (!isNaN(newMult)&&newMult>0) { opt.multiplier=newMult; saveOptionsByType(type,options); renderContent(); showToast('✅ 已更新'); } }
        function deleteOption(type, id) { if (!isAdmin) { showToast('仅管理员可操作'); return; } const options=getOptionsByType(type); if (!confirm('确定要删除这个选项吗？')) return; const newOptions=options.filter(o=>o.id!==id); saveOptionsByType(type,newOptions); if (type==='schedule'&&currentScheduleId===id) currentScheduleId=''; if (type==='purpose'&&currentPurposeId===id){ const remaining=getPurposeOptions(); currentPurposeId=remaining.length>0?remaining[0].id:''; } if (type==='urgent'&&currentUrgentId===id){ const remaining=getUrgentOptions(); const noneOpt=remaining.find(o=>o.label==='无'); currentUrgentId=noneOpt?noneOpt.id:(remaining.length>0?remaining[0].id:''); } renderContent(); showToast('✅ 已删除'); }
        function addOption(type) { if (!isAdmin) return; const label=prompt('输入新选项名称：'); if (!label||!label.trim()) return; const mult=parseFloat(prompt('输入倍数（如 1、1.5、2）：','1')); if (isNaN(mult)||mult<=0) { showToast('❌ 请输入有效的倍数'); return; } const options=getOptionsByType(type); const newId=type+'_'+Date.now(); options.push({id:newId,label:label.trim(),multiplier:mult}); saveOptionsByType(type,options); renderContent(); showToast('✅ 已添加'); }
        function editNote(type) { if (!isAdmin) return; if (type==='schedule') { const currentNote=getScheduleNote(); const newNote=prompt('修改说明文字：', currentNote); if (newNote!==null) { saveScheduleNote(newNote); renderContent(); showToast('✅ 已更新说明'); } } }
        function renderOptionEditor(type, options, labelText, noteText) {
            let html=`<div class="option-editor"><div style="font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:4px;">${labelText}</div>`;
            if (options.length===0) html+='<div class="empty-hint">暂无选项，点击下方添加</div>';
            else options.forEach(opt=>{ html+=`<div class="option-item"><span class="opt-label" onclick="editOptionLabel('${type}','${opt.id}')">${opt.label}</span><span style="color:var(--text-secondary);">×</span><span class="opt-multiplier" onclick="editOptionMultiplier('${type}','${opt.id}')">${opt.multiplier}</span><span class="opt-delete" onclick="deleteOption('${type}','${opt.id}')">✕</span></div>`; });
            html+=`<div class="add-option-btn" onclick="addOption('${type}')">+ 添加选项</div>${noteText?`<div class="option-note" onclick="editNote('${type}')">💡 ${noteText}</div>`:''}</div>`;
            return html;
        }

        function buildOptionsHtml(options, selectedId, type) {
            if (options.length===0) return '';
            let html='';
            options.forEach(opt => {
                const selected = opt.id===selectedId ? 'selected' : '';
                let disabled='';
                if (type==='urgent') {
                    const scheduleEl=document.getElementById('schedule_select');
                    if (scheduleEl && scheduleEl.value && scheduleEl.value!=='') { if (opt.label!=='无') disabled='disabled'; }
                }
                if (type==='schedule') {
                    const urgentEl=document.getElementById('urgent_select');
                    if (urgentEl && urgentEl.value) { const urgentOpts=getUrgentOptions(); const selUrgent=urgentOpts.find(o=>o.id===urgentEl.value); if (selUrgent && selUrgent.label!=='无') disabled='disabled'; }
                }

        function calcRowTotal(row, multiplier){ const qty=row.quantity||1, unitPrice=row.unitPrice||0, normalLayers=row.normalLayers||0, specialLayers=row.specialLayers||0, discountQty=row.sameMoldDiscount||0; const effectiveDiscount=Math.max(0,Math.min(discountQty,qty-1)); const mode=getMoldMode(), fixedAmount=getMoldFixedAmount(), discountMultiplier=getMoldDiscountMultiplier(); let productCost; if(mode==='fixed'){ productCost=qty*unitPrice-effectiveDiscount*fixedAmount; if(productCost<0) productCost=0; } else { const normalCount=qty-effectiveDiscount, discountedCount=effectiveDiscount; productCost=normalCount*unitPrice+discountedCount*unitPrice*discountMultiplier; } const normalPriceItem=data.priceList.find(p=>p.name==='普通工艺层'), specialPriceItem=data.priceList.find(p=>p.name==='特殊工艺层'); const normalPrice=normalPriceItem?normalPriceItem.price:8, specialPrice=specialPriceItem?specialPriceItem.price:10; const processCost=normalLayers*normalPrice+specialLayers*specialPrice; const subtotal=productCost+processCost; return subtotal*multiplier; }

        function renderNav(){ const container=document.getElementById('navContainer'); const adminItems=[{key:'home',icon:'🏠',label:'首页'},{key:'orders',icon:'📋',label:'订单总表'},{key:'price',icon:'💰',label:'价目表'},{key:'calendar',icon:'📅',label:'排期日历'},{key:'inquiry',icon:'🔍',label:'统计查询'},{key:'order_form',icon:'✍️',label:'约稿条'}]; const clientItems=[{key:'home',icon:'🏠',label:'首页'},{key:'price',icon:'💰',label:'价目表'},{key:'calendar',icon:'📅',label:'排期日历'},{key:'order_form',icon:'✍️',label:'约稿条'}]; const items=isAdmin?adminItems:clientItems; let html=''; items.forEach(item=>{ const active=currentView===item.key?'active':''; html+=`<button class="nav-item ${active}" data-view="${item.key}"><span class="icon">${item.icon}</span><span class="label">${item.label}</span></button>`; }); container.innerHTML=html; container.querySelectorAll('.nav-item').forEach(btn=>{ btn.addEventListener('click',()=>{ const view=btn.dataset.view; if(view==='order_form'){ currentItems=[]; editingOrderId=null; const pOpts=getPurposeOptions(); currentPurposeId=pOpts.length>0?pOpts[0].id:''; currentScheduleId=''; const uOpts=getUrgentOptions(); const noneOpt=uOpts.find(o=>o.label==='无'); currentUrgentId=noneOpt?noneOpt.id:(uOpts.length>0?uOpts[0].id:''); } navigateTo(view); }); }); const tag=document.getElementById('modeTag'); if(isAdmin){ tag.textContent='🛠️ 管理端'; tag.style.background='var(--primary-light)'; tag.style.color='var(--text-secondary)'; } else { tag.textContent='👤 客户模式'; tag.style.background='var(--border)'; tag.style.color='var(--text-secondary)'; } }

        function renderContent(){ const container=document.getElementById('appContent'); const title=document.getElementById('pageTitle'); const sub=document.getElementById('pageSub'); switch(currentView){ case 'home': title.innerHTML='首页 <span class="sub">仪表盘</span>'; container.innerHTML=renderHome(); break; case 'orders': title.innerHTML='📋 订单总表 <span class="sub">所有企划</span>'; container.innerHTML=renderOrders(); break; case 'price': title.innerHTML='💰 价目表 <span class="sub">点击品名/备注/类别/单价直接编辑 · 拖拽手柄排序</span>'; container.innerHTML=renderPrice(); break; case 'calendar': title.innerHTML='📅 排期日历 <span class="sub">'+calendarYear+'年'+calendarMonth+'月</span>'; container.innerHTML=renderCalendar(); break; case 'inquiry': title.innerHTML='🔍 统计查询 <span class="sub">按CN/联系方式</span>'; container.innerHTML=renderInquiry(); break; case 'order_form': title.innerHTML='✍️ 约稿条 <span class="sub">'+(isAdmin?'管理端 · 可编辑选项':'填写新企划')+'</span>'; container.innerHTML=renderOrderForm(); if(isAdmin){ setTimeout(fixDropdowns,100); } break; default: container.innerHTML='<p>页面建设中</p>'; } if(currentView==='price'&&isAdmin){ setTimeout(initInlineEdit,50); } }

        // ========== 首页 ==========
        function renderHome(){ const now=new Date(); const year=now.getFullYear(), month=now.getMonth()+1; const progress=getMonthProgress(year,month), total=getMonthTotal(year,month); const recent=[...data.orders].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).slice(-5).reverse(); let recentHtml=''; if(recent.length===0){ recentHtml='<div class="empty-state"><div class="big-icon">📭</div><p>暂无订单</p></div>'; } else { recentHtml=`<table><thead><tr><th>企划名</th><th>单主</th><th>ddl</th><th>总价</th><th>进度</th></tr></thead><tbody>${recent.map(o=>`<tr><td><strong>${o.projectName||'未命名'}</strong></td><td>${o.cn||'-'}</td><td>${o.ddl?formatDate(o.ddl):'-'}</td><td>${formatPrice(o.totalPrice||0)}</td><td><span class="status-badge ${o.status==='已完成'?'done':'pending'}">${o.status||'进行中'}</span></td></tr>`).join('')}</tbody></table>`; } let pwdHtml=''; if(isAdmin){ pwdHtml=`<div class="change-pwd-area"><div class="label">🔑 管理密码：<strong>••••••</strong></div><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn-sm" onclick="changePassword()" style="background:var(--primary);color:#fff;padding:6px 20px;">修改密码</button><button class="btn-sm fix-btn" onclick="fixDropdowns()" style="background:#E08040;color:#fff;padding:6px 20px;">🔧 修复下拉框</button></div></div>`; } const currentName=getWorkbenchName(); const renameHtml=isAdmin?`<div class="rename-area"><div class="left-section"><span class="label-icon">🏷️</span><div><div class="label-text">工作台名称</div><span class="name-display" id="displayName">${currentName}</span><span class="sync-hint">✦ 同步至客户端</span></div></div><div class="btn-group"><button class="btn-sm rename-btn" onclick="renameWorkbench()">✏️ 修改名称</button></div></div>`:''; const themeHtml=isAdmin?`<div class="theme-switcher-area"><div class="label"><span class="label-icon">🎨</span>配色方案<span style="font-size:12px;font-weight:400;color:var(--text-secondary);margin-left:4px;">· 同步至客户端</span></div><div class="theme-options">${getThemeOptionsHtml()}</div></div>`:''; let transferHtml=''; if(isAdmin){ transferHtml=`<div class="data-transfer-area"><div class="label">📦 数据同步<span class="sub">导入/导出完整数据（含订单、选项配置、主题等）</span></div><div class="btn-group"><button class="btn-sm export-btn" onclick="exportData()">📤 导出全部数据</button><button class="btn-sm import-btn" onclick="importData()">📥 导入数据</button><button class="btn-sm standalone-export-btn" onclick="exportStandaloneHTML()">📄 导出独立HTML</button></div></div>`; } else { transferHtml=`<div class="data-transfer-area"><div class="label">📦 数据导出<span class="sub">将您填写的订单数据导出，发送给管理员</span></div><div class="btn-group"><button class="btn-sm export-btn" onclick="exportData()">📤 导出我的数据</button></div></div>`; } let statsHtml=''; if(isAdmin){ statsHtml=`<div class="stats-grid"><div class="stat-card"><div class="label">📊 本月进度</div><div class="value">${progress.done} <small>/ ${progress.total}</small></div><div class="sub-info">${progress.total===0?'本月暂无企划':'已完成 '+progress.done+' 份'}</div></div><div class="stat-card"><div class="label">💰 本月营收</div><div class="value">${formatPrice(total)}</div><div class="sub-info">共 ${progress.total} 份企划</div></div><div class="stat-card" style="border-left-color:var(--primary-light);"><div class="label">📅 排期日历</div><div class="value" style="font-size:24px;">${year}年${month}月</div><div class="sub-info">${getMonthOrders(year,month).length} 份排期中</div><button class="jump-btn" onclick="navigateTo('calendar')">查看日历 →</button></div></div>`; } else { statsHtml=`<div class="stats-grid" style="grid-template-columns:1fr;"><div class="stat-card" style="border-left-color:var(--primary-light);"><div class="label">📅 排期日历</div><div class="value" style="font-size:24px;">${year}年${month}月</div><div class="sub-info">${getMonthOrders(year,month).length} 份排期中</div><button class="jump-btn" onclick="navigateTo('calendar')">查看日历 →</button></div></div>`; } return `${pwdHtml}${renameHtml}${themeHtml}${transferHtml}${statsHtml}<div class="card"><div class="card-title">🕐 最近订单</div>${recentHtml}</div>${!isAdmin?`<div class="card" style="text-align:center;padding:30px;"><div style="font-size:40px;margin-bottom:10px;">✍️</div><h3 style="margin-bottom:6px;">提交新企划</h3><p style="color:var(--text-secondary);margin-bottom:16px;">填写约稿条，开启新的合作</p><button class="btn-primary" onclick="navigateTo('order_form')">去填写 →</button></div>`:''}`; }

        // ========== 修改名称 ==========
        function renameWorkbench(){ if(!isAdmin){ showToast('仅管理员可修改'); return; } const currentName=getWorkbenchName(); const newName=prompt('请输入新的工作台名称：',currentName); if(newName===null) return; const trimmed=newName.trim(); if(!trimmed){ showToast('❌ 名称不能为空'); return; } setWorkbenchName(trimmed); showToast(`✅ 工作台名称已更新为“${trimmed}”`); }
        function changePassword(){ const currentPwd=getAdminPassword(); const oldInput=prompt('请输入当前密码：'); if(oldInput===null) return; if(oldInput!==currentPwd){ showToast('❌ 当前密码错误'); return; } const newPwd=prompt('请输入新密码（至少4位）：'); if(newPwd===null) return; if(newPwd.length<4){ showToast('❌ 密码至少4位'); return; } const confirmPwd=prompt('请再次输入新密码确认：'); if(confirmPwd===null) return; if(newPwd!==confirmPwd){ showToast('❌ 两次密码不一致'); return; } setAdminPassword(newPwd); showToast('✅ 密码已修改成功！'); }

        // ========== 订单总表 ==========
        function renderOrders(){ if(data.orders.length===0){ return `<div class="card"><div class="empty-state"><div class="big-icon">📭</div><p>暂无订单，去 <a href="#" onclick="navigateTo('order_form');return false;">约稿条</a> 添加吧</p></div></div>`; } let rows=''; data.orders.forEach(o=>{ const status=o.status||'进行中'; const cls=status==='已完成'?'done':'pending'; rows+=`<tr><td><strong>${o.projectName||'未命名'}</strong></td><td>${o.cn||'-'}</td><td>${o.characterName||'-'}</td><td>${o.ddl?formatDate(o.ddl):'-'}</td><td>${formatPrice(o.totalPrice||0)}</td><td><span class="status-badge ${cls}">${status}</span></td><td>${isAdmin?`<button class="btn-sm" onclick="editOrder('${o.id}')">✏️</button><button class="btn-sm danger" onclick="deleteOrder('${o.id}')">🗑️</button><button class="btn-sm" onclick="toggleStatus('${o.id}')">✔️</button>`:''}</td></tr>`; }); return `<div class="card"><div class="card-title">全部企划 (${data.orders.length})${isAdmin?`<button class="action-btn" onclick="navigateTo('order_form')">+ 新增</button>`:''}</div><div class="table-wrap"><table><thead><tr><th>企划名</th><th>单主</th><th>角色</th><th>ddl</th><th>总价</th><th>进度</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div>`; }

        // ========== 价目表 ==========
        const CATEGORY_OPTIONS=['吧唧类','纸制品类','亚克力类','宣图类','实用制品类','工艺品类','其他类'];
        function renderPrice(){ if(!Array.isArray(data.priceList)){ const defaultData=getDefaultData(); data.priceList=defaultData.priceList; saveData(); } if(!isAdmin){ const sorted=getSortedPriceList(); let rows=''; sorted.forEach(p=>{ rows+=`<tr><td><strong>${p.name}</strong></td><td>${p.note||''}</td><td>${p.category}</td><td>${formatPrice(p.price)}</td><td>—</td></tr>`; }); return `<div class="card"><div class="card-title">制品价格库 (${data.priceList.length} 项)</div><div class="table-wrap"><table><thead><tr><th>制品名</th><th>备注</th><th>类别</th><th>单价</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div><p style="margin-top:12px;font-size:13px;color:var(--text-secondary);">🔒 只读模式，价格以管理员发布为准</p></div>`; } let batchControls=''; if(isAdmin){ const allCount=data.priceList.length; const selectedCount=selectedIds.size; const allSelected=allCount>0&&selectedCount===allCount; batchControls=`<div class="batch-controls"><span style="font-weight:500;color:var(--text-secondary);">${batchMode?'📌 批量删除模式':'🔹 常规模式'}${batchMode?`（已选 ${selectedCount} 项）`:''}</span><div class="btn-group" style="display:flex;gap:8px;flex-wrap:wrap;">${!batchMode?`<button class="btn-sm" onclick="toggleBatchMode()" style="background:var(--primary);color:#fff;">📦 批量删除</button>`:`<button class="btn-sm" onclick="toggleSelectAll()" style="background:var(--primary-light);color:var(--text);">${allSelected?'取消全选':'全选'}</button><button class="btn-sm batch-delete-btn" onclick="deleteSelected()">🗑️ 删除选中</button><button class="btn-sm batch-cancel-btn" onclick="toggleBatchMode()">取消</button>`}</div></div>`; } const sortControls=`<div class="sort-controls"><span class="sort-label">📌 排序：</span><button class="btn-sm sort-btn" onclick="sortByCategory()">按类别排序</button><button class="btn-sm sort-btn" onclick="resetSortOrder()">重置排序</button><span style="font-size:12px;color:var(--text-secondary);margin-left:6px;">💡 拖拽手柄 ☰ 可手动调整顺序</span></div>`; const sortedList=getSortedPriceList(); let rows=''; sortedList.forEach((p,index)=>{ let checkboxTd=''; if(batchMode){ const checked=selectedIds.has(p.id)?'checked':''; checkboxTd=`<td><input type="checkbox" class="batch-checkbox" data-id="${p.id}" ${checked} onchange="toggleSelectOne('${p.id}')" /></td>`; } rows+=`<tr draggable="true" data-id="${p.id}" data-index="${index}" ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="drop(event)" ondragend="dragEnd(event)">${checkboxTd}<td style="width:30px;text-align:center;"><span class="drag-handle" title="拖拽排序">☰</span></td><td><div class="editable-cell" data-field="name" data-id="${p.id}" data-index="${index}"><span class="display-text">${p.name}</span></div></td><td><div class="editable-cell" data-field="note" data-id="${p.id}" data-index="${index}"><span class="display-text">${p.note||''}</span></div></td><td><div class="editable-cell" data-field="category" data-id="${p.id}" data-index="${index}"><span class="display-text">${p.category}</span></div></td><td><div class="editable-cell" data-field="price" data-id="${p.id}" data-index="${index}"><span class="display-text">${formatPrice(p.price)}</span></div></td><td>${!batchMode?`<button class="btn-sm danger" onclick="deletePrice('${p.id}')">🗑️</button>`:''}</td></tr>`; }); if(data.priceList.length===0){ rows=`<tr><td colspan="${batchMode?7:6}" style="text-align:center;padding:30px;color:var(--text-secondary);">暂无制品，点击「添加制品」创建</td></tr>`; } return `<div class="card"><div class="card-title">制品价格库 (${data.priceList.length} 项)<button class="action-btn" onclick="addPrice()">+ 添加制品</button>${!batchMode?`<button class="action-btn" onclick="toggleBatchMode()" style="color:var(--delete-color);">📦 批量删除</button>`:''}</div>${batchControls}${sortControls}<div class="edit-hint"><span>💡 点击品名 / 备注 / 类别 / 单价 直接修改，回车或失焦自动保存 · 拖拽 ☰ 排序</span></div><div class="table-wrap" style="margin-top:12px;"><table><thead><tr>${batchMode?'<th style="width:30px;"><input type="checkbox" onchange="toggleSelectAll()" '+(data.priceList.length>0&&selectedIds.size===data.priceList.length?'checked':'')+' /></th>':''}<th style="width:30px;"></th><th>制品名</th><th>备注</th><th>类别</th><th>单价</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div>`; }

        // 拖拽排序
        let dragSrcIndex=null, dragSrcId=null;
        function dragStart(e){ const tr=e.target.closest('tr'); if(!tr) return; dragSrcIndex=parseInt(tr.dataset.index); dragSrcId=tr.dataset.id; tr.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragSrcId); }
        function dragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; const tr=e.target.closest('tr'); if(tr&&tr.dataset.id!==dragSrcId){ tr.classList.add('drag-over'); } }
        function drop(e){ e.preventDefault(); const targetTr=e.target.closest('tr'); if(!targetTr||targetTr.dataset.id===dragSrcId){ removeDragOver(); return; } const targetId=targetTr.dataset.id; const sorted=getSortedPriceList(); const srcIndex=sorted.findIndex(p=>p.id===dragSrcId); const tgtIndex=sorted.findIndex(p=>p.id===targetId); if(srcIndex===-1||tgtIndex===-1){ removeDragOver(); return; } const [removed]=sorted.splice(srcIndex,1); sorted.splice(tgtIndex,0,removed); const orderIds=sorted.map(p=>p.id); saveSortOrder(orderIds); removeDragOver(); renderContent(); showToast('✅ 排序已更新'); }
        function dragEnd(e){ removeDragOver(); const tr=e.target.closest('tr'); if(tr) tr.classList.remove('dragging'); }
        function removeDragOver(){ document.querySelectorAll('tr.drag-over').forEach(el=>el.classList.remove('drag-over')); }
        function sortByCategory(){ if(!isAdmin) return; const sorted=getSortedPriceList(); sorted.sort((a,b)=>a.category.localeCompare(b.category)); const orderIds=sorted.map(p=>p.id); saveSortOrder(orderIds); renderContent(); showToast('✅ 已按类别排序'); }
        function resetSortOrder(){ if(!isAdmin) return; localStorage.removeItem(SORT_ORDER_KEY); renderContent(); showToast('✅ 已重置排序（按添加顺序）'); }

        // 行内编辑
        function initInlineEdit(){ document.querySelectorAll('.editable-cell').forEach(cell=>{ cell.removeEventListener('click',handleCellClick); cell.addEventListener('click',handleCellClick); }); }
        function handleCellClick(e){ const cell=e.currentTarget; if(cell.querySelector('.inline-input')||cell.querySelector('.inline-select')) return; const field=cell.dataset.field, id=cell.dataset.id; const displayText=cell.querySelector('.display-text'); if(!displayText) return; const currentValue=displayText.textContent.trim(); const item=data.priceList.find(p=>p.id===id); if(!item) return; if(field==='category'){ const select=document.createElement('select'); select.className='inline-select'; CATEGORY_OPTIONS.forEach(cat=>{ const opt=document.createElement('option'); opt.value=cat; opt.textContent=cat; if(cat===currentValue) opt.selected=true; select.appendChild(opt); }); cell.innerHTML=''; cell.appendChild(select); select.focus(); select.addEventListener('blur',()=>{ saveInlineEdit(id,field,select.value,cell); }); select.addEventListener('keydown',(ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); select.blur(); } if(ev.key==='Escape'){ cancelInlineEdit(cell,currentValue); } }); select.addEventListener('mousedown',(ev)=>ev.stopPropagation()); } else if(field==='price'){ const rawValue=currentValue.replace('¥ ','').replace(',',''); const input=document.createElement('input'); input.type='number'; input.className='inline-input'; input.step='0.01'; input.value=rawValue; cell.innerHTML=''; cell.appendChild(input); input.focus(); input.select(); input.addEventListener('blur',()=>{ const val=parseFloat(input.value); if(!isNaN(val)&&val>=0){ saveInlineEdit(id,field,val,cell); } else { cancelInlineEdit(cell,currentValue); } }); input.addEventListener('keydown',(ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); input.blur(); } if(ev.key==='Escape'){ cancelInlineEdit(cell,currentValue); } }); } else { const input=document.createElement('input'); input.type='text'; input.className='inline-input'; input.value=currentValue; input.placeholder=field==='note'?'输入备注':'输入品名'; cell.innerHTML=''; cell.appendChild(input); input.focus(); input.select(); input.addEventListener('blur',()=>{ const val=input.value.trim(); if(field==='name'&&!val){ cancelInlineEdit(cell,currentValue); showToast('❌ 品名不能为空'); return; } saveInlineEdit(id,field,val,cell); }); input.addEventListener('keydown',(ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); input.blur(); } if(ev.key==='Escape'){ cancelInlineEdit(cell,currentValue); } }); } }
        function saveInlineEdit(id,field,value,cell){ const item=data.priceList.find(p=>p.id===id); if(!item) return; if(field==='price'){ item.price=Number(value); } else if(field==='name'){ item.name=String(value); } else if(field==='category'){ item.category=String(value); } else if(field==='note'){ item.note=String(value); } saveData(); let displayValue=''; if(field==='price'){ displayValue=formatPrice(item.price); } else { displayValue=item[field]||''; } cell.innerHTML=`<span class="display-text">${displayValue}</span>`; showToast('✅ 已更新'); }
        function cancelInlineEdit(cell,originalValue){ cell.innerHTML=`<span class="display-text">${originalValue}</span>`; }

        // ========== 排期日历 ==========
        function renderCalendar(){ const year=calendarYear, month=calendarMonth; const firstDay=new Date(year,month-1,1).getDay(); const daysInMonth=new Date(year,month,0).getDate(); const monthOrders=getMonthOrders(year,month); const map={}; monthOrders.forEach(o=>{ if(o.ddl){ const d=new Date(o.ddl); if(d.getFullYear()===year&&d.getMonth()===month-1){ const day=d.getDate(); if(!map[day]) map[day]=[]; map[day].push(o); } } }); const today=new Date(); const isToday=(y,m,d)=>y===today.getFullYear()&&m===today.getMonth()+1&&d===today.getDate(); let cells=''; for(let i=0;i<firstDay;i++){ cells+=`<div class="day-cell empty"></div>`; } for(let d=1;d<=daysInMonth;d++){ const events=map[d]||[]; const hasEvent=events.length>0; const isTodayFlag=isToday(year,month,d); let cls='day-cell'; if(hasEvent) cls+=' has-event'; if(isTodayFlag) cls+=' today'; let eventHtml=''; if(hasEvent){ const show=events.slice(0,2); eventHtml=show.map(o=>`<div class="event">${o.projectName||'未命名'} (${o.cn||'?'})</div>`).join(''); if(events.length>2){ eventHtml+=`<div class="event" style="background:var(--border);color:var(--text-secondary);">+${events.length-2} 更多</div>`; } } cells+=`<div class="${cls}"><div class="day-number">${d}</div>${eventHtml}</div>`; } const monthNames=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月']; return `<div class="card"><div class="calendar-header"><div class="month-label">${year}年 ${monthNames[month-1]} <span class="count">${monthOrders.length} 份企划</span></div><div class="calendar-nav"><button onclick="changeMonth(-1)">‹</button><button onclick="changeMonth(0)">今天</button><button onclick="changeMonth(1)">›</button></div></div><div class="calendar-grid"><div class="day-label">日</div><div class="day-label">一</div><div class="day-label">二</div><div class="day-label">三</div><div class="day-label">四</div><div class="day-label">五</div><div class="day-label">六</div>${cells}</div><div style="margin-top:16px;font-size:13px;color:var(--text-secondary);">📌 共 ${monthOrders.length} 份企划，总金额 ${formatPrice(getMonthTotal(year,month))}</div></div>`; }
        function changeMonth(delta){ if(delta===0){ const now=new Date(); calendarYear=now.getFullYear(); calendarMonth=now.getMonth()+1; } else { calendarMonth+=delta; if(calendarMonth<1){ calendarMonth=12; calendarYear--; } if(calendarMonth>12){ calendarMonth=1; calendarYear++; } } renderContent(); }

        // ========== 统计查询 ==========
        function renderInquiry(){ return `<div class="card"><div class="card-title">🔍 查询订单</div><div class="search-box"><input type="text" id="searchInput" placeholder="输入 单主CN 或 联系方式 搜索..." oninput="doSearch()" /><button class="btn-primary" onclick="doSearch()">搜索</button></div><div id="searchResults"><div class="empty-state"><div class="big-icon">🔎</div><p>输入关键词开始搜索</p></div></div></div>`; }

ml=`<div style="margin-bottom:10px;font-size:13px;font-weight:600;">已添加 ${currentItems.length} 个制品 <span style="font-weight:400;color:var(--text-secondary);margin-left:10px;">当前倍数：×${totalMult}</span></div><div class="table-wrap"><table><thead><tr><th>制品</th><th>数量</th><th>单价</th><th>普通工艺层数</th><th>特殊工艺层数</th><th>同模数</th><th>备注</th><th>小计</th></tr></thead><tbody>${currentItems.map((it,idx)=>`<tr><td>${it.productName||'-'}</td><td>${it.quantity||1}</td><td>${formatPrice(it.unitPrice||0)}</td><td>${it.normalLayers||0}</td><td>${it.specialLayers||0}</td><td>${it.sameMoldDiscount||0}</td><td>${it.note||''}</td><td>${formatPrice(it.rowTotal||0)}</td></tr>`).join('')}</tbody></table></div><div class="total-summary">💰 制品合计：<span>${formatPrice(total)}</span></div>`; } const backHomeHtml=`<div class="back-home-section"><button class="btn-back-home" onclick="navigateTo('home')">🏠 返回首页</button></div>`; if(submitted&&!isAdmin){ return `${adminConfigHtml}<div class="card"><div class="card-title">📜 约前须知</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.8;background:var(--bg);padding:16px 20px;border-radius:10px;white-space:pre-line;">${termsText}</div></div><div class="submitted-overlay"><div class="check-icon">✅</div><div class="msg">您的企划已成功提交！</div><div class="sub-msg">感谢您的信任，管理员将尽快处理您的订单。</div><div style="margin-top:12px;font-size:13px;color:var(--text-secondary);">💡 如需修改，请联系管理员（管理员可在「订单总表」中直接编辑）</div></div>${backHomeHtml}`; } const mutexHint=(isAdmin||!showScheduleSection)?'':`<div class="mutual-exclusion-hint">💡 插排期/钞位置 与 加急（除"无"外）不可同时选择</div>`; let scheduleSectionHtml=''; if(showScheduleSection){ scheduleSectionHtml=`<div class="form-row"><div class="form-group"><label>插排期/钞位置</label><select id="schedule_select" onchange="onOptionChange()"><option value="">无</option>${scheduleHtml}</select><div style="font-size:12px;color:var(--text-secondary);margin-top:4px;opacity:.7;">${scheduleNote}</div></div><div class="form-group"><label>加急</label><select id="urgent_select" onchange="onOptionChange()">${urgentHtml}</select></div></div>${mutexHint}`; } else { scheduleSectionHtml=`<div class="form-row"><div class="form-group"><label>加急</label><select id="urgent_select" onchange="onOptionChange()">${urgentHtml}</select></div><div class="form-group" style="display:flex;align-items:center;"><div style="padding:9px 14px;background:var(--primary-light);border-radius:10px;font-size:13px;color:var(--text-secondary);">📌 插排期/钞位置已关闭（倍数为 ×1）</div></div></div><input type="hidden" id="schedule_select" value="" />`; } return `${adminConfigHtml}<div class="card"><div class="card-title">📜 约前须知</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.8;background:var(--bg);padding:16px 20px;border-radius:10px;white-space:pre-line;">${termsText}</div></div><div class="card"><div class="card-title">✍️ 填写企划信息</div><form id="orderForm" onsubmit="submitOrder(event)"><div class="form-row"><div class="form-group"><label>单主CN <span class="required">*</span></label><input type="text" id="f_cn" required placeholder="你的昵称" /></div><div class="form-group"><label>联系方式 <span class="required">*</span></label><input type="text" id="f_contact" required placeholder="QQ / 微信" /></div></div><div class="form-row"><div class="form-group"><label>IP</label><input type="text" id="f_ip" placeholder="如：光与夜之恋 / 韩漫书名" /></div><div class="form-group"><label>企划名 <span class="required">*</span></label><input type="text" id="f_project" required placeholder="企划名" /></div></div><div class="form-row"><div class="form-group"><label>角色名</label><input type="text" id="f_character" placeholder="角色名称" /></div><div class="form-group"><label>用途 <span class="required">*</span></label><select id="purpose_select" onchange="onOptionChange()">${purposeHtml}</select></div></div>${scheduleSectionHtml}<div class="form-group"><label>当前计算倍数</label><div style="padding:9px 14px;background:var(--primary-light);border-radius:10px;font-size:18px;font-weight:700;color:var(--text);">×<span id="multiplierDisplay">${totalMult}</span><span style="font-size:13px;font-weight:400;color:var(--text-secondary);margin-left:10px;" id="multiplierDesc">${(()=>{const pOpt=purposeOptions.find(o=>o.id===currentPurposeId); const sOpt=scheduleOptions.find(o=>o.id===currentScheduleId); const uOpt=urgentOptions.find(o=>o.id===currentUrgentId); const parts=[]; if(pOpt) parts.push(pOpt.label+'×'+pOpt.multiplier); if(sOpt&&scheduleOptions.length>0) parts.push(sOpt.label+'×'+sOpt.multiplier); if(uOpt&&uOpt.label!=='无') parts.push(uOpt.label+'×'+uOpt.multiplier); return parts.length>0?'= '+parts.join(' × '):'未选择';})()}</span></div></div><div class="form-group"><label>ddl (截稿日) <span class="required">*</span></label><input type="date" id="f_ddl" required /></div><hr style="border:none;border-top:2px dashed var(--border);margin:20px 0;" /><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;"><div><strong style="font-size:15px;">🧾 制品明细</strong><span style="font-size:13px;color:var(--text-secondary);margin-left:10px;">已添加 ${itemCount} 项</span></div><button type="button" class="btn-primary" onclick="openItemModal()">+ 添加/编辑制品</button></div><div id="orderItemsPreview" style="margin-top:16px;background:var(--bg);padding:16px 20px;border-radius:10px;">${itemsHtml}</div><div style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;"><button type="button" class="btn-outline" onclick="refreshPrices()">🔄 刷新价格（同步价目表）</button><span style="font-size:12px;color:var(--text-secondary);">修改工艺层价格后点击此处更新</span></div><div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;"><button type="submit" class="btn-primary">📤 提交企划</button><button type="button" class="btn-outline" onclick="resetForm()">清空重填</button></div></form>${backHomeHtml}</div>`; }

        // ========== 制品填写表（模态框） ==========
        function openItemModal(){ if(isClientSubmitted()&&!isAdmin){ showToast('⚠️ 订单已提交，无法修改'); return; } const modal=document.getElementById('itemModal'); const body=document.getElementById('modalBody'); if(currentItems.length===0){ currentItems.push({id:uid(),productName:'',quantity:1,unitPrice:0,normalLayers:0,specialLayers:0,sameMoldDiscount:0,note:'',rowTotal:0,_multiplier:calcFinalMultiplier(currentPurposeId,currentScheduleId,currentUrgentId)}); } const currentMultiplier=calcFinalMultiplier(currentPurposeId,currentScheduleId,currentUrgentId); 
            // 修复：分组下拉框由内部函数构建
            function buildOptionsHtmlForItem(it) {

                }
                return optionsHtml;
            }

                });

                const total=calcOrderTotal(currentItems,currentPurposeId,currentScheduleId,currentUrgentId);
